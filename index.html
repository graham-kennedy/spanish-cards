<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<title>Café Español</title>
<style>
:root{
  --surface:#ffffff; --raised:#f0f0f0; --ink:#000000; --muted:#5a5c5c; --line:#d6d6d6; --strong:#767878;
  --blue:#186cbb; --on-blue:#ffffff;
  --green:#137a6d; --green-l:#d0e4e2; --orange:#b44d00; --orange-l:#f0dbcc;
  --good:var(--green); --bad:var(--orange);
}
@media (prefers-color-scheme: dark){
  :root{--surface:#0b0b0b; --raised:#1a1a1a; --ink:#f2f2f2; --muted:#a8aaaa; --line:#2e2e2e; --strong:#8a8c8c;
    --blue:#5aa6ec; --on-blue:#000000;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
body{margin:0;background:var(--surface);color:var(--ink);font:18px/28px "Helvetica Neue",Helvetica,Arial,sans-serif}
h1{margin:0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.01em}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.dock>*{max-width:720px;margin-left:auto;margin-right:auto}
.dock .act{margin-top:0;padding:12px 16px 12px;flex-wrap:nowrap}
.dock .act>*{min-width:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:8px 16px calc(110px + env(safe-area-inset-bottom))}
button.play{border:1px solid var(--strong);background:var(--surface);color:var(--ink);border-radius:4px;min-width:48px;min-height:48px;padding:8px 14px;font:inherit;font-size:16px;cursor:pointer;transition:background-color .15s,color .15s}
button.play:hover{background:var(--ink);color:var(--surface)}
button.play.lg{font-size:26px;padding:16px 28px;align-self:center}
.ans .play{margin-top:8px}
header{max-width:720px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center;min-height:56px}
#back,#homelink{color:var(--blue);font:500 16px/24px "Helvetica Neue",Helvetica,Arial,sans-serif;text-decoration:none;min-height:48px;display:inline-flex;align-items:center}
#back:hover,#homelink:hover{color:var(--ink)}
[hidden]{display:none!important}
.auto{display:inline-flex;align-items:center;gap:12px;min-height:48px;background:none;border:0;color:var(--ink);font:500 16px/24px "Helvetica Neue",Helvetica,Arial,sans-serif;cursor:pointer;padding:0}
.pill{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line);border:1px solid var(--strong);transition:background-color .15s,border-color .15s}
.pill i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:var(--surface);border:1px solid var(--strong);transition:transform .15s}
.auto[aria-checked=true] .pill{background:var(--blue);border-color:var(--blue)}
.auto[aria-checked=true] .pill i{transform:translateX(22px);border-color:var(--surface)}
h2{margin:32px 0 12px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tags{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tagbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:64px;padding:12px 16px;background:var(--raised);color:var(--ink);text-decoration:none;font:700 18px/24px "Helvetica Neue",Helvetica,Arial,sans-serif;transition:background-color .15s,color .15s}
.tagbtn i{font-style:normal;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tagbtn:hover{background:var(--ink);color:var(--surface)}.tagbtn:hover i{color:var(--surface)}
.vex{margin-top:12px;padding:12px 16px;background:var(--raised)}.vex b,.vex span{display:block}.vex span+b{margin-top:12px}.vex span{color:var(--muted);font-size:16px}
.tl{overflow-x:auto;margin:16px -16px 0;padding:0 16px;scroll-snap-type:x proximity;scroll-padding:0 16px;-webkit-overflow-scrolling:touch}
.tl-track{position:relative;padding-top:8px}
.tl-track::before{content:'';position:absolute;left:0;right:0;top:15px;height:1px;background:var(--strong)}
.tl-c{position:relative;padding:24px 8px 0 0;scroll-snap-align:start}
.tl-c .dot{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:999px;background:var(--surface);border:2px solid var(--strong)}
.tl-c b{display:block;font-size:18px;line-height:24px;overflow-wrap:anywhere}
.tl-c span{display:block;color:var(--muted);font-size:14px;line-height:20px}
.tl-c.now .dot{background:var(--blue);border-color:var(--blue)}
.tl-c.now b{color:var(--blue)}
.seasons{margin-top:24px}
.season{background:var(--raised);padding:8px 12px;border-left:2px solid var(--surface);min-width:0}
.season b,.season span{display:block;line-height:20px}.season b{font-size:16px}.season span{color:var(--muted);font-size:14px}
.tlh{margin-top:32px}
.tl-fit .tl-c{padding-right:4px}.tl-fit .tl-c b{font-size:16px;line-height:20px}.tl-fit .tl-c span{font-size:13px;line-height:18px}
.vhead{margin-top:16px}.vhead .note{margin-top:4px}
.tags+.tags{margin-top:12px}
.card[data-a]{cursor:pointer}
button.sq{flex:0 0 56px;min-width:0;padding:12px 0}
#app{touch-action:pan-y}
.card{background:var(--raised);border:0;border-radius:0;padding:32px 24px;margin-top:16px;min-height:min(52vh,420px);display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px}
.tag{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:16px;line-height:24px}
.ans{margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
.ans .es{font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.01em;color:var(--blue)}
.ex{margin:12px 0 0;padding:0;list-style:none;text-align:left}
.ex li{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ex .t{flex:1}.ex .t b{display:block}.ex .t span{color:var(--muted);font-size:16px}
.row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
@media (max-width:420px){.big{font-size:28px;line-height:34px}.ans .es{font-size:28px;line-height:34px}}
button.btn{font:500 18px/24px "Helvetica Neue",Helvetica,Arial,sans-serif;min-height:56px;transition:background-color .15s,color .15s,border-color .15s;border-radius:4px;border:1px solid var(--strong);background:var(--surface);color:var(--ink);padding:12px 16px;cursor:pointer}
button.btn:hover{border-color:var(--ink)}
button.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
button.pri:hover{background:var(--ink);border-color:var(--ink);color:var(--surface)}
button.good{background:var(--ink);border-color:var(--ink);color:var(--surface)}
button.good:hover{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
button.bad{background:var(--surface);border-color:var(--strong);color:var(--ink)}
button.btn:disabled{opacity:.5;cursor:default}
.ex1{display:flex;gap:12px;align-items:center;text-align:left;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.ex1 .t{flex:1}.ex1 .t b{display:block}.ex1 .t span{color:var(--muted);font-size:16px}
.verb{text-align:left;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.verb table{border-collapse:collapse;width:100%;margin-top:8px;font-size:16px;line-height:24px}
.verb td{padding:4px 0;border-bottom:1px solid var(--line)}.verb td:first-child{color:var(--muted);width:50%}
</style>
</head>

/* ---------- Speech (Spain Spanish voice) ---------- */
function speak(text){
  if(!('speechSynthesis' in window))return;
  const t=text.replace(/…|_+/g,'').replace(/\//g,',').trim();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';
  const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
  const v=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs[0];if(v){u.voice=v;u.lang=v.lang}
  u.rate=0.85;speechSynthesis.speak(u);
}

function conjType(k){
  const d=TYPES[k], inf=d.ex, stem=inf.slice(0,-2);
  const ends=es=>es.map(e=>[[stem,0],[e,1]]);
  return {id:k,label:'-'+k,sub:inf,title:'-'+k+' verbs',note:inf+', '+d.en,tenses:[
    {name:'Present',forms:ends(d.pres)},
    {name:'Near future',forms:IR_A.map(f=>[[f+' ',1],[inf,0]])},
    {name:'Present perfect',forms:HABER.map(f=>[[f+' ',1],[stem,0],[d.part,1]])},
    {name:'Simple past',forms:ends(d.pret)},
    {name:'Imperfect',forms:ends(d.imp)},
    {name:'Future',forms:FUT.map(e=>[[inf,0],[e,1]])},
  ].map((te,i)=>({...te,ex:EXS[k][i]}))};
}

let D=null;
function newDeck(ids){D={ids,queue:shuffle(ids),revealed:false,hist:[]}}
function prevCard(){
  if(!D.hist.length)return;
  D.queue.unshift(D.hist.pop());
  D.revealed=false;render();
}
function flip(){
  D.revealed=!D.revealed;render();
  if(D.revealed&&AUTO&&BY_ID[D.queue[0]].dir==='S')speak(spoken(BY_ID[D.queue[0]]));
}
function nextCard(again){
  const id=D.queue.shift();
  D.hist.push(id);if(D.hist.length>100)D.hist.shift();
  if(again)D.queue.splice(Math.min(3,D.queue.length),0,id);
  if(!D.queue.length)D.queue=shuffle(D.ids);
  D.revealed=false;render();
}
function viewCards(){
  const x=BY_ID[D.queue[0]], isH=x.dir==='H';
  const [main,note]=splitNote(x.en);
  const sen=sentOf(x), vb=x.verb||VERB[x.id];
  const detail=()=>{
    let h='';
    if(sen)h+=`<div class="ex1"><button class="play" data-a="plays" aria-label="Play sentence">🔊</button><div class="t"><b>${esc(sen[0])}</b><span>${esc(sen[1])}</span></div></div>`;
    if(vb)h+=`<div class="verb"><div class="tag">${esc(vb.inf)} · ${esc(vb.en)} · ${esc(vb.tense)}</div><table>${vb.forms.map((f,i)=>`<tr><td>${PRON[i]}</td><td><b>${esc(f)}</b></td></tr>`).join('')}</table></div>`;
    return h;
  };
  let front,back='';
  if(isH){
    front=`<button class="play lg" data-a="play" aria-label="Play audio">🔊</button><div class="big">${esc(x.es)}</div>`;
    if(D.revealed)back=`<div class="ans"><div class="es" style="color:var(--ink)">${esc(main)}</div>${note?`<div class="note">${esc(note)}</div>`:''}${detail()}</div>`;
  }else{
    front=`<div class="big">${esc(main)}</div>`;
    if(D.revealed)back=`<div class="ans"><div class="es">${esc(x.es)}</div><button class="play" data-a="play" aria-label="Play audio">🔊</button>${note?`<div class="note">${esc(note)}</div>`:''}${detail()}</div>`;
  }
  const prev=`<button class="btn sq" data-a="prev" aria-label="Previous card" ${D.hist.length?'':'disabled'}>←</button>`;
  const act=prev+(D.revealed
    ?`<button class="btn" data-a="again">Again</button><button class="btn pri" data-a="next">Next</button>`
    :`<button class="btn pri" data-a="flip">Show answer</button>`);
  return {html:`<div class="card" data-a="flip">${front}${back}</div>`,act};
}

};
function route(){
  const h=decodeURIComponent(location.hash.slice(1)).split('/');
  const sec=SECTIONS[h[0]];
  if(sec){const item=sec.items.find(i=>i.id===h[1]);return item?{type:'page',key:h[0],sec,item}:{type:'list',key:h[0],sec}}
  const pool=h[0]==='g'?GRAM[h[1]]:h[0]==='s'?SIT[h[1]]:h[0]==='t'?TIME[h[1]]:h[0]==='v'?VOC[h[1]]:h[0]==='all'?CARDS.map(c=>c.id):null;
  return pool&&pool.length?{type:'deck',pool,key:location.hash}:{type:'home'};
}
function viewHome(){
  const grp=(title,map,k)=>`<h2>${title}</h2><div class="tags">${Object.entries(map).map(([n,ids])=>
    `<a class="tagbtn" href="#${k}/${encodeURIComponent(n)}"><span>${esc(n)}</span><i>${ids.length}</i></a>`).join('')}</div>`;
  return grp('Grammar',GRAM,'g')+grp('Situation',SIT,'s')+grp('Time',TIME,'t')+grp('Vocabulary',VOC,'v')+
    `<div class="tags"><a class="tagbtn" href="#all"><span>All cards</span><i>${CARDS.length}</i></a></div>`+
    `<h2>Reference</h2><div class="tags">${Object.entries(SECTIONS).map(([k,s])=>`<a class="tagbtn" href="#${k}"><span>${s.title}</span><i>${s.items.length}</i></a>`).join('')}</div>`;
}
function viewList(sec,key){
  return `<div class="tags">${sec.items.map(v=>`<a class="tagbtn" href="#${key}/${encodeURIComponent(v.id)}"><span>${esc(v.label)}</span><i>${esc(v.sub)}</i></a>`).join('')}</div>`;
}
function showAuto(){const b=$('#auto');b.setAttribute('aria-checked',AUTO)}
function autoplay(){if(AUTO&&D&&!D.revealed&&BY_ID[D.queue[0]].dir==='H')speak(spoken(BY_ID[D.queue[0]]))}
let curKey=null;
function paint(html,act){$('#app').innerHTML=html;$('#act').innerHTML=act||'';window.scrollTo(0,0)}
function render(){
  const r=route(), back=$('#back'), hl=$('#homelink');
  const deck=r.type==='deck';
  back.hidden=r.type==='home'; back.href=r.type==='page'?'#'+r.key:'#';
  back.textContent=r.type==='page'?'← '+r.sec.title:'← Home';
  hl.hidden=r.type!=='page';
  $('#auto').hidden=$('#act').hidden=!deck;
  if('speechSynthesis' in window&&!deck)speechSynthesis.cancel();
  if(r.type==='home'){D=null;curKey=null;return paint(viewHome())}
  if(r.type==='list'){D=null;curKey=null;return paint(viewList(r.sec,r.key))}
  if(r.type==='page'){D=null;curKey=null;return paint(r.sec.page(r.item))}
  const fresh=!D||curKey!==r.key;
  if(fresh){curKey=r.key;newDeck(r.pool)}
  const v=viewCards();paint(v.html,v.act);
  if(fresh)autoplay();
}
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{
  if(Date.now()-swiped<400)return;
  const b=e.target.closest('[data-a]');if(!b)return;
  switch(b.dataset.a){
    case'flip':flip();break;
    case'prev':prevCard();break;
    case'next':nextCard(false);autoplay();break;
    case'again':nextCard(true);autoplay();break;
    case'play':speak(spoken(BY_ID[D.queue[0]]));break;
    case'plays':speak(sentOf(BY_ID[D.queue[0]])[0]);break;
    case'auto':AUTO=!AUTO;try{localStorage.setItem('cafe-auto',AUTO?'1':'0')}catch(e){}showAuto();break;
  }
});
/* Keyboard: right = next card, left = previous, space / enter / up / down = flip. */
document.addEventListener('keydown',e=>{
  const tg=e.target&&e.target.closest?e.target:document.body;
  if(!D||e.metaKey||e.ctrlKey||e.altKey||tg.closest('input,select,textarea'))return;
  const onCtl=!!tg.closest('button,a');
  if(e.key==='ArrowRight'){e.preventDefault();nextCard(false);autoplay()}
  else if(e.key==='ArrowLeft'){e.preventDefault();prevCard()}
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'||((e.key===' '||e.key==='Enter')&&!onCtl)){e.preventDefault();flip()}
});
/* Swipe: left = next card, right = previous, tap = flip. */
let tx=0,ty=0,tt=0;
document.addEventListener('touchstart',e=>{const q=e.touches[0];tx=q.clientX;ty=q.clientY;tt=Date.now()},{passive:true});
document.addEventListener('touchend',e=>{
  if(!D||e.target.closest('.dock,header'))return;
  const q=e.changedTouches[0], dx=q.clientX-tx, dy=q.clientY-ty;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-tt>800)return;
  if(dx<0){nextCard(false);autoplay()}else prevCard();
  swiped=Date.now();
},{passive:true});
let swiped=0;
showAuto();render();
</script>
</body>
</html>
